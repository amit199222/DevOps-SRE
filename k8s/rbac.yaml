apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-leak-service
  namespace: devsecops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memory-leak-config-reader
  namespace: devsecops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memory-leak-config-reader
  namespace: devsecops
subjects:
  - kind: ServiceAccount
    name: memory-leak-service
    namespace: devsecops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memory-leak-config-reader