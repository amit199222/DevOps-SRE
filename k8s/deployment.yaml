
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-leak-service
  labels:
    app: memory-leak-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-leak-service
  template:
    metadata:
      labels:
        app: memory-leak-service
    spec:
      containers:
        - name: memory-leak-service
          image: ghcr.io/OWNER/REPOSITORY:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1200Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
