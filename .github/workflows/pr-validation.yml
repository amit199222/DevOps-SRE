
name: PR Security Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test-lint-sast:
    name: Unit Tests, Lint and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v test/

      - name: Run Flake8
        run: python -m flake8 app test

      - name: Run Bandit SAST
        run: python -m bandit -r app -s B104 -ll

  build-and-scan:
    name: Build and Scan Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --pull -t memory-leak-service:pr .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memory-leak-service:pr
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
