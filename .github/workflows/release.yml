
name: Release and Update GitOps Manifest

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: >-
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main after merge
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image name and tag
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release image
        run: |
          docker build --pull \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" .

      - name: Scan release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release image
        run: |
          docker push \
            "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"

      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

          # Install yq
          YQ_VERSION="v4.45.1"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          # Update only the app container in all three Deployments
          for version in v1 v2 v3; do
            yq -i \
              "(.[] | select(.kind == \"Deployment\" and .metadata.name == \"memory-leak-service-${version}\") | .spec.template.spec.containers[] | select(.name == \"app\") | .image) = \"${IMAGE}-${version}\"" \
              k8s/deployment.yaml
          done

          # Verify the resulting image tags
          yq -r '
            select(.kind == "Deployment") |
            .metadata.name as $deployment |
            .spec.template.spec.containers[] |
            select(.name == "app") |
            "\($deployment): \(.image)"
          ' k8s/deployment.yaml

      
      - name: Create GitOps manifest update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-image-${{ steps.image.outputs.tag }}
          delete-branch: true
          commit-message: "chore(gitops): update memory service image"
          title: "chore(gitops): update memory service image"
          body: |
            Automated image update after a successful release build
            and container vulnerability scan.
          add-paths: k8s/deployment.yaml

